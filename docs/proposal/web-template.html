<style>
/* 레이아웃: 한 열 문서, 넓은 화면에서는 760px 본문 + 스크린샷은 옆 열 */
:root {
  --bg: #fbfaf8; --surface: #f2f1ee; --ink: #16181c; --ink-2: #4b5059; --ink-3: #868b94;
  --line: #e4e2dd; --accent: #e8930c; --accent-ink: #9a5d00; --accent-soft: #fff4e0;
  --dark: #1b2029; --dark-ink: #f4f2ee; --dark-muted: #aab1bc;
  --ok-bg: #e2f3e8; --ok: #1d7c45; --warn-bg: #fdefd6; --warn: #9c5c00; --plan-bg: #ebecee; --plan: #4b5059; --must-bg: #ffe4cf; --must: #a8430a;
  --w1: #277BBD; --w2: #46A3B8; --w3: #7B85CD; --w4: #C69B62;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-display: "Gothic A1", "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111317; --surface: #1b1e24; --ink: #eceae6; --ink-2: #b8bcc4; --ink-3: #868b94;
  --line: #2b2f37; --accent: #f5a524; --accent-ink: #f5b54a; --accent-soft: #2a2114;
  --dark: #222732; --dark-ink: #f4f2ee; --dark-muted: #aab1bc;
  --ok-bg: #16301f; --ok: #6fd39a; --warn-bg: #33260f; --warn: #f2bd5c; --plan-bg: #262a31; --plan: #b8bcc4; --must-bg: #3a2213; --must: #ff9f63;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1b1e24; --ink: #eceae6; --ink-2: #b8bcc4; --ink-3: #868b94;
  --line: #2b2f37; --accent: #f5a524; --accent-ink: #f5b54a; --accent-soft: #2a2114;
  --dark: #222732; --dark-ink: #f4f2ee; --dark-muted: #aab1bc;
  --ok-bg: #16301f; --ok: #6fd39a; --warn-bg: #33260f; --warn: #f2bd5c; --plan-bg: #262a31; --plan: #b8bcc4; --must-bg: #3a2213; --must: #ff9f63;
  color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7; word-break: keep-all; overflow-wrap: anywhere; }
.page { max-width: 820px; margin: 0 auto; padding-block: 8px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

nav.tabs { display: flex; gap: 6px; padding: 10px 0 18px; }
nav.tabs a { text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: 14px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); }
nav.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
nav.tabs a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.35; margin: 0; text-wrap: balance; }
h2 { font-size: 22px; font-weight: 800; margin: 44px 0 14px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); display: flex; gap: 10px; align-items: baseline; }
h2 .num { color: var(--accent); }
h3 { font-size: 17px; font-weight: 700; margin: 26px 0 8px; }
h4 { font-size: 15.5px; font-weight: 700; margin: 0 0 6px; }
p { margin: 0 0 10px; }
ul, ol { margin: 0 0 10px; padding-left: 20px; }
li { margin: 3px 0; }
a { color: var(--accent-ink); }

.cover { padding: 8px 0 8px; }
.cover .top { font-size: 12px; color: var(--ink-3); letter-spacing: .02em; }
.cover .title { font-family: var(--font-display); font-size: clamp(34px, 9vw, 54px); font-weight: 800; letter-spacing: -.01em; line-height: 1.1; margin: 14px 0 10px; }
.cover .sub { font-size: 18px; color: var(--ink-2); font-weight: 500; line-height: 1.5; }
.cover .sub span { font-size: 14px !important; color: var(--ink-3) !important; }
.cover .bar { width: 56px; height: 4px; background: var(--accent); margin: 22px 0; border-radius: 2px; }
.cover .lead { max-width: none !important; }
.meta-table { border-collapse: collapse; margin-top: 18px; font-size: 13.5px; }
.meta-table td { padding: 4px 16px 4px 0; vertical-align: top; border: 0; }
.meta-table td:first-child { color: var(--ink-3); white-space: nowrap; }

.lead { font-size: 16.5px; color: var(--ink-2); }
.muted { color: var(--ink-3); } .small { font-size: 13.5px; }
.caption, .cap { font-size: 12.5px; color: var(--ink-3); margin: 6px 0 14px; line-height: 1.55; }

.tw { overflow-x: auto; margin: 6px 0 14px; -webkit-overflow-scrolling: touch; }
.tw table { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 13.5px; }
th, td { border-bottom: 1px solid var(--line); padding: 8px 9px; text-align: left; vertical-align: top; }
th { background: var(--surface); color: var(--ink-2); font-weight: 700; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; } td.c, th.c { text-align: center; }
td { font-variant-numeric: tabular-nums; }

.box { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 10px 0 14px; min-width: 0; }
.box.soft { background: var(--surface); border-color: var(--surface); }
.box.accent { background: var(--accent-soft); border-color: transparent; border-left: 4px solid var(--accent); border-radius: 4px 12px 12px 4px; }
.box.dark { background: var(--dark); color: var(--dark-ink); border-color: var(--dark); }
.box.dark .muted { color: var(--dark-muted); }
.box .label { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; color: var(--ink-3); margin-bottom: 6px; }
.box.dark .label { color: var(--accent); }
.box p:last-child, .box ul:last-child, .box ol:last-child { margin-bottom: 0; }

.grid2, .grid3 { display: grid; gap: 12px; grid-template-columns: 1fr; margin: 10px 0 14px; }
.grid2 > *, .grid3 > * { margin: 0 !important; min-width: 0; }
@media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } .grid3 { grid-template-columns: 1fr 1fr 1fr; } }

.tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 9px; border-radius: 999px; white-space: nowrap; }
.tag.done { background: var(--ok-bg); color: var(--ok); } .tag.proto { background: var(--warn-bg); color: var(--warn); }
.tag.plan { background: var(--plan-bg); color: var(--plan); } .tag.must { background: var(--must-bg); color: var(--must); }

.flow { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px; }
.flow .step { flex: 1 1 130px; background: var(--surface); border-radius: 10px; padding: 10px 12px; text-align: center; min-width: 0; }
.flow .step b { display: block; font-size: 14.5px; } .flow .step span { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; display: block; }
.flow .arrow { display: none; }

.weights { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin: 8px 0 4px; }
.weights div:nth-child(1) { background: var(--w1) !important; } .weights div:nth-child(2) { background: var(--w2) !important; }
.weights div:nth-child(3) { background: var(--w3) !important; } .weights div:nth-child(4) { background: var(--w4) !important; }

.shot, .st-shot img, .shots2 img { width: 100%; max-width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); display: block; }
.shot-wrap { margin: 10px 0 14px; }
.shots2 { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 640px) { .shots2 { grid-template-columns: 1fr 1fr; } }

.scenario .st { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 12px; padding: 18px 0; border-bottom: 1px solid var(--line); counter-increment: st; }
.scenario { counter-reset: st; }
.scenario .st:last-child { border-bottom: 0; }
.scenario .st .n { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--bg); font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 14px; grid-row: span 2; }
.scenario .st .n::before { content: counter(st); }
.scenario .st > div:nth-child(2) { min-width: 0; }
.scenario .st-shot { grid-column: 2; margin-top: 10px; display: grid; gap: 10px; }
.scenario .kv { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 4px 10px; font-size: 14px; margin: 0; }
.scenario .kv dt { color: var(--ink-3); font-weight: 600; } .scenario .kv dd { margin: 0; }
@media (max-width: 480px) { .scenario .kv { grid-template-columns: 1fr; gap: 0; } .scenario .kv dd { margin-bottom: 6px; } }

.check { padding-left: 0; } .check li { list-style: none; position: relative; padding-left: 26px; }
.check li::before { content: "☐"; position: absolute; left: 0; color: var(--ink-3); }
.formula { font-size: 15px; font-weight: 600; text-align: center; padding: 12px; background: var(--surface); border-radius: 10px; margin: 10px 0 12px; }
.footer-note { font-size: 12.5px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 24px; }
code { font-family: var(--font-mono); font-size: 12.5px; background: var(--surface); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.arch { font-family: var(--font-mono); font-size: 12px; background: var(--surface); border-radius: 10px; padding: 12px 14px; white-space: pre; line-height: 1.6; overflow-x: auto; min-width: 0; }
.kpi { display: none; }
.dl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 8px; }
.dl button { font: inherit; font-weight: 700; font-size: 14.5px; padding: 11px 16px; border-radius: 10px; border: 0; background: var(--accent); color: #1b1407; cursor: pointer; flex: 1 1 180px; }
.dl button + button { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.dl button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.dl-msg { flex-basis: 100%; margin: 0; font-size: 13px; color: var(--ink-3); min-height: 1em; }
section { scroll-margin-top: 12px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

/* ══ v2: 슬라이드형 12쪽의 구성 요소. 클래스·색 이름은 proposal.css와 같다(여기서는 화면용 크기와 밝은/어두운 테마 값) ══ */
:root {
  --soft: var(--surface); --navy: var(--dark);
  --seg1: #f5a524; --seg1-soft: #fdebc8; --seg2: #3a9ee0; --seg2-soft: #d9ecfa;
  --fact: #1d7c45; --impl: #2467c9; --asm: #9c5c00; --bad: #c2412d;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --seg1-soft: #4a3610; --seg2: #4aa8e8; --seg2-soft: #173247;
  --fact: #6fd39a; --impl: #7fb0ff; --asm: #f2bd5c; --bad: #ff8a75;
  --card-bg: #1b1e24; --card-line: #3a3f49; --accent-line: #5a4215; --hl: #6b4a08;
  --st-drive-bg: #3d2c0e; --st-drive: #f5c26b; --st-stop-bg: #16301f; --st-stop: #6fd39a;
  --todo-bg: #3a2f0d; --todo: #f2d27a; } }
:root[data-theme="dark"] {
  --seg1-soft: #4a3610; --seg2: #4aa8e8; --seg2-soft: #173247;
  --fact: #6fd39a; --impl: #7fb0ff; --asm: #f2bd5c; --bad: #ff8a75;
  --card-bg: #1b1e24; --card-line: #3a3f49; --accent-line: #5a4215; --hl: #6b4a08;
  --st-drive-bg: #3d2c0e; --st-drive: #f5c26b; --st-stop-bg: #16301f; --st-stop: #6fd39a;
  --todo-bg: #3a2f0d; --todo: #f2d27a; }

.page { max-width: 960px; }
.sheet { margin: 0 0 30px; scroll-margin-top: 12px; }
.body { display: flex; flex-direction: column; gap: 16px; }
h2.ph { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
h2.ph .no { color: var(--accent); font-size: 30px; line-height: 1; }
h2.ph .ko { font-family: var(--font-body); font-size: 14px; font-weight: 500; color: var(--ink-2); }
h2.ph .crit { margin-left: auto; font-family: var(--font-body); font-size: 12px; font-weight: 700; background: var(--dark); color: var(--dark-ink); border-radius: 999px; padding: 3px 12px; white-space: nowrap; }
h2.ph .crit i { font-style: normal; font-weight: 500; color: var(--dark-muted); margin-right: 6px; }
.msg { font-family: var(--font-display); font-size: clamp(20px, 3.4vw, 26px); font-weight: 800; line-height: 1.4; margin: 0 0 18px; text-wrap: balance; }
.msg b { background: linear-gradient(transparent 60%, var(--hl) 60%); }
.msg small { display: block; font-family: var(--font-body); font-size: 14px; font-weight: 400; color: var(--ink-2); margin-top: 6px; }
.pf { display: none; }
.split { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 760px) { .split { grid-template-columns: var(--cols, 1fr 1fr); } }
.split > * { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
@media (min-width: 760px) { .row { grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); } }
.row > * { min-width: 0; }
.row.kpi { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 560px) { .row.kpi { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--card-bg); min-width: 0; }
.card.soft { background: var(--surface); border-color: var(--surface); }
.card.dark { background: var(--dark); border-color: var(--dark); color: var(--dark-ink); }
.card.hl { background: var(--accent-soft); border-color: var(--accent-line); }
.card h4 { margin-bottom: 4px; }
.card p { margin: 0; font-size: 14px; }
.card p + p { margin-top: 4px; }
.card p.one { font-size: 17px; font-weight: 700; line-height: 1.55; }
.lab { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; color: var(--ink-3); margin-bottom: 4px; }
.card.dark .lab { color: var(--accent); }
.sec { font-size: 14px; font-weight: 800; color: var(--ink-2); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.sec::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--accent); flex: none; }
.big { font-family: var(--font-display); font-size: 32px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }

.card p.src, p.src { font-size: 12px; color: var(--ink-3); line-height: 1.5; margin: 6px 0 0; }
.chip { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 3px 11px; border-radius: 12px; background: var(--surface); color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

ul.pt li::before { content: ""; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
figure { margin: 0; }
figure img, img.shot { width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid var(--line); }
figcaption { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; line-height: 1.55; }
.k { display: inline-block; font-family: var(--font-body); font-size: 10.5px; font-weight: 700; padding: 0 5px; border-radius: 4px; border: 1px solid currentColor; line-height: 1.5; vertical-align: 1px; white-space: nowrap; }
.k.fact { color: var(--fact); } .k.impl { color: var(--impl); } .k.asm { color: var(--asm); }
.todo { background: var(--todo-bg); color: var(--todo); outline: 1px dashed currentColor; padding: 0 5px; border-radius: 4px; font-weight: 600; }
.st { display: inline-block; font-family: var(--font-body); font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.st.drive { background: var(--st-drive-bg); color: var(--st-drive); }
.st.stop { background: var(--st-stop-bg); color: var(--st-stop); }

.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); vertical-align: middle; }
.dot.half { background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); border: 1px solid var(--accent); }

.cv-top { font-size: 12px; color: var(--ink-3); letter-spacing: .02em; margin-bottom: 12px; }

<script>
(function () {
  // 탭(#proposal, #guideline)과 기획서 안의 쪽 이동(#p01 ~ #p12)을 같은 해시로 처리한다.
  function show() {
    var v = location.hash === '#guideline' ? 'guideline' : 'proposal';
    document.getElementById('view-proposal').hidden = v !== 'proposal';
    document.getElementById('view-guideline').hidden = v !== 'guideline';
    document.querySelectorAll('nav.tabs a').forEach(function (a) {
      if (a.dataset.view === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }
  function jump() {
    var target = /^#p\d\d$/.test(location.hash) ? document.getElementById(location.hash.slice(1)) : null;
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', function () { show(); jump(); });
  show();
  if (/^#p\d\d$/.test(location.hash)) jump();

  var msg = document.getElementById('dl-msg');
  var buttons = document.querySelectorAll('.dl button');
  var downloadsPromise = window.claude && window.claude.use ? window.claude.use('downloads') : Promise.resolve(null);
  buttons.forEach(function (b) {
    b.addEventListener('click', async function () {
      msg.textContent = 'PDF를 준비하는 중…';
      try {
        var downloads = await downloadsPromise;
        if (!downloads) { msg.textContent = '이 화면에서는 저장할 수 없어요. claude.ai에서 이 페이지를 열어 주세요.'; return; }
        var res = await fetch(b.dataset.src);
        if (!res.ok) throw { code: 'fetch', message: String(res.status) };
        var blob = await res.blob();
        var r = await downloads.save({ filename: b.dataset.name, data: blob });
        msg.textContent = r.status === 'saved' ? b.dataset.name + ' 저장을 시작했어요.' : '';
      } catch (e) {
        var code = e && e.code;
        msg.textContent = code === 'declined' ? '저장을 취소했어요.'
          : code === 'rate_limited' ? '잠시 후 다시 눌러 주세요.'
          : '저장하지 못했어요 (' + (code || '알 수 없는 오류') + ').';
      }
    });
  });
})();
</script>
